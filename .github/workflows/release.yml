name: Release

on:
  schedule:
    - cron: "7 6,18 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream tag to cut (default: upstream latest release)"
        required: false
        type: string
      force:
        description: Cut another -nix.N even if this upstream tag was released
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  UPSTREAM: krishna-swaroop/KiCAD-Prism

jobs:
  release:
    name: Cut a release from the newest upstream tag
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Work off a detached HEAD
        run: git checkout --detach

      - name: Decide which tag to cut
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          WANT: ${{ inputs.tag }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail

          if [ -n "$WANT" ]; then
            upstream_tag="$WANT"
          else
            upstream_tag=$(gh release view --repo "$UPSTREAM" --json tagName --jq .tagName)
          fi
          echo "Upstream's latest release is ${upstream_tag}."

          # Our tags are the upstream tag plus a packaging counter, so a
          # packaging-only fix can be re-cut against the same upstream release.
          last=$(git tag --list "${upstream_tag}-nix.*" \
                   | sed -E "s/.*-nix\.//" | sort -n | tail -1)

          if [ -n "$last" ] && [ "$FORCE" != "true" ]; then
            echo "Already released as ${upstream_tag}-nix.${last}; nothing to do." \
              >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          next=$(( ${last:-0} + 1 ))

          {
            echo "skip=false"
            echo "upstream_tag=${upstream_tag}"
            echo "tag=${upstream_tag}-nix.${next}"
          } >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-nix
        if: steps.plan.outputs.skip == 'false'

      - uses: ./.github/actions/pin-upstream
        if: steps.plan.outputs.skip == 'false'
        with:
          ref: ${{ steps.plan.outputs.upstream_tag }}
          upstream: ${{ env.UPSTREAM }}

      - name: Tag the pin
        if: steps.plan.outputs.skip == 'false'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          UPSTREAM_TAG: ${{ steps.plan.outputs.upstream_tag }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "chore(release): pin upstream to ${UPSTREAM_TAG}" flake.nix flake.lock
          git tag -a "$TAG" -m "KiCad Prism ${UPSTREAM_TAG}, packaging ${TAG##*-nix.}"
          git push origin "refs/tags/${TAG}"

      - name: Build the tag in CI
        if: steps.plan.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail

          gh workflow run ci.yml --ref "$TAG"

          run=""
          for _ in $(seq 30); do
            sleep 5
            run=$(gh run list --workflow ci.yml --branch "$TAG" \
                    --event workflow_dispatch --limit 1 \
                    --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$run" ] && break
          done
          if [ -z "$run" ]; then
            echo "CI never started on ${TAG}." >&2
            exit 1
          fi

          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run}"
          echo "Tagged ${TAG}; building it in ${url}" >> "$GITHUB_STEP_SUMMARY"

          gh run watch "$run" --exit-status --interval 60
