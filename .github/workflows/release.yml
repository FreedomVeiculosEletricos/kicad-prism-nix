name: Release

on:
  schedule:
    - cron: "7 6,18 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream tag to cut (default: upstream latest release)"
        required: false
        type: string
      force:
        description: Cut another -nix.N even if this upstream tag was released
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  UPSTREAM: krishna-swaroop/KiCAD-Prism

jobs:
  release:
    name: Cut a release from the newest upstream tag
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Work off a detached HEAD
        run: git checkout --detach

      - name: Decide which tag to cut
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          WANT: ${{ inputs.tag }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail

          if [ -n "$WANT" ]; then
            upstream_tag="$WANT"
          else
            upstream_tag=$(gh release view --repo "$UPSTREAM" --json tagName --jq .tagName)
          fi
          echo "Upstream's latest release is ${upstream_tag}."

          # Our tags are the upstream tag plus a packaging counter, so a
          # packaging-only fix can be re-cut against the same upstream release.
          last=$(git tag --list "${upstream_tag}-nix.*" \
                   | sed -E "s/.*-nix\.//" | sort -n | tail -1)

          if [ -n "$last" ] && [ "$FORCE" != "true" ]; then
            last_tag="${upstream_tag}-nix.${last}"
            published=$(gh release view "$last_tag" --json isDraft --jq '.isDraft | not' 2>/dev/null || echo false)

            if [ "$published" = "true" ]; then
              echo "Already released as ${last_tag}; nothing to do." >> "$GITHUB_STEP_SUMMARY"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [ "$(git rev-parse "${last_tag}^")" = "$(git rev-parse HEAD)" ]; then
              {
                echo "${last_tag} was cut from this same main and never published."
                echo "Publishing it failed; publish it by hand, or re-run with force to retry."
              } | tee -a "$GITHUB_STEP_SUMMARY" >&2
              exit 1
            fi

            echo "${last_tag} was never published and main has moved; cutting a new one." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

          next=$(( ${last:-0} + 1 ))

          {
            echo "skip=false"
            echo "upstream_tag=${upstream_tag}"
            echo "tag=${upstream_tag}-nix.${next}"
          } >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-nix
        if: steps.plan.outputs.skip == 'false'

      - uses: ./.github/actions/pin-upstream
        if: steps.plan.outputs.skip == 'false'
        with:
          ref: ${{ steps.plan.outputs.upstream_tag }}
          upstream: ${{ env.UPSTREAM }}

      - name: Push the pin for Garnix
        id: push
        if: steps.plan.outputs.skip == 'false'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          UPSTREAM_TAG: ${{ steps.plan.outputs.upstream_tag }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "chore(release): pin upstream to ${UPSTREAM_TAG}" flake.nix flake.lock
          git push --force origin "HEAD:refs/heads/release/${TAG}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/await-garnix
        id: garnix
        if: steps.plan.outputs.skip == 'false'
        with:
          sha: ${{ steps.push.outputs.sha }}

      - name: Tag and publish the release
        if: steps.plan.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          UPSTREAM_TAG: ${{ steps.plan.outputs.upstream_tag }}
          BUILD: ${{ steps.garnix.outputs.url }}
        run: |
          set -euo pipefail

          git tag -a "$TAG" -m "KiCad Prism ${UPSTREAM_TAG}, packaging ${TAG##*-nix.}"
          git push origin "refs/tags/${TAG}"

          cat > notes.md <<NOTES
          Packaging of upstream [\`${UPSTREAM_TAG}\`](https://github.com/${UPSTREAM}/releases/tag/${UPSTREAM_TAG}), [built green on Garnix](${BUILD}).
          NOTES

          gh release create "$TAG" --verify-tag --latest \
            --title "$TAG" --notes-file notes.md

      - name: Drop the release branch
        if: always() && steps.push.outcome == 'success'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: git push origin --delete "refs/heads/release/${TAG}"
